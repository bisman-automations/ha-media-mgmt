grant_extension:
  fields:
    profile_id:
      required: true
      selector:
        config_entry:
          integration: media_mgmt
    minutes:
      required: true
      selector:
        number:
          min: -240
          max: 240
          step: 5
          unit_of_measurement: min
force_block:
  fields:
    profile_id:
      required: true
      selector:
        config_entry:
          integration: media_mgmt
unblock:
  fields:
    profile_id:
      required: true
      selector:
        config_entry:
          integration: media_mgmt
reset_usage:
  fields:
    profile_id:
      required: true
      selector:
        config_entry:
          integration: media_mgmt
block_media:
  fields:
    profile_id:
      required: true
      selector:
        config_entry:
          integration: media_mgmt
    kind:
      required: true
      default: artist
      selector:
        select:
          translation_key: block_kind
          options:
          - track
          - artist
          - album
          - source
          - keyword
    value:
      example: Baby Shark
      selector:
        text: null
    current:
      default: false
      selector:
        boolean: null
unblock_media:
  fields:
    profile_id:
      required: true
      selector:
        config_entry:
          integration: media_mgmt
    kind:
      required: true
      default: artist
      selector:
        select:
          translation_key: block_kind
          options:
          - track
          - artist
          - album
          - source
          - keyword
    value:
      required: true
      selector:
        text: null
set_sleep_timer:
  fields:
    profile_id:
      required: true
      selector:
        config_entry:
          integration: media_mgmt
    minutes:
      required: true
      default: 30
      selector:
        number:
          min: 1
          max: 720
          unit_of_measurement: min
    fade_minutes:
      default: 0
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: min
cancel_sleep_timer:
  fields:
    profile_id:
      required: true
      selector:
        config_entry:
          integration: media_mgmt
run_schedule:
  fields:
    profile_id:
      required: true
      selector:
        config_entry:
          integration: media_mgmt
    schedule:
      required: true
      example: Bedtime music
      selector:
        text: null

play_artist:
  fields:
    artist:
      required: true
      example: Taylor Swift
      selector:
        text: null
    profile_id:
      selector:
        config_entry:
          integration: media_mgmt
    entity_id:
      selector:
        entity:
          domain: media_player
    speaker:
      example: Kids Room
      selector:
        text: null
    area_id:
      selector:
        area: {}
    advanced:
      collapsed: true
      fields:
        media_type:
          default: artist
          selector:
            select:
              translation_key: media_type
              options:
                - artist
                - album
                - track
                - playlist
        uri:
          example: library://artist/12
          selector:
            text: null
        radio_mode:
          selector:
            boolean: null
        shuffle:
          selector:
            boolean: null
        volume:
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
        enqueue:
          default: replace
          selector:
            select:
              translation_key: enqueue
              options:
                - play
                - replace
                - next
                - add
